name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Cache VLCKit
        uses: actions/cache@v4
        with:
          path: Vendor/VLCKit/VLCKit-all.xcframework
          key: vlckit-3.6.0

      - name: Fetch VLCKit
        run: bash scripts/fetch-vlckit.sh

      - name: Port to iOS 15
        run: |
          python3 port_ios15.py .
          grep -A2 deploymentTarget project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "---- first errors ----"
          grep -E "error:" build.log | head -n 200 || true
          exit $rc

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DouDuo.app Payload/
          zip -qry DouDuo-unsigned.ipa Payload
          ls -la DouDuo-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-unsigned-ipa
          path: DouDuo-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
