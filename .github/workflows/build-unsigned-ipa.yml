name: build-unsigned-ipa

# 云端编译：用 GitHub 的 macOS 26 机器（自带 Xcode 26 / iOS 26 SDK）编出未签名 IPA。
# 产物在 Actions 的 Artifacts 里，下载后可直接用巨魔安装，不需要证书和 Apple ID。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache VLCKit
        uses: actions/cache@v4
        with:
          path: Vendor/VLCKit/VLCKit-all.xcframework
          key: vlckit-3.6.0

      - name: Fetch VLCKit
        run: |
          if [ -x scripts/fetch-vlckit.sh ]; then bash scripts/fetch-vlckit.sh; fi

      - name: Generate Xcode project
        shell: bash
        run: |
          if [ -f project-ios15.yml ]; then
            xcodegen generate --spec project-ios15.yml
          else
            xcodegen generate
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 200

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          cd Payload && zip -qry ../DouDuo-unsigned.ipa . && cd ..
          ls -la DouDuo-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-unsigned-ipa
          path: DouDuo-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
